<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>SSO</title></head>
<body>
<script>
var SURL = 'https://script.google.com/macros/s/AKfycbw7mKh6uGdydT9FuamLbw979veQaZJd07cKdA0m2UaDZms5ZdyhOmGLT6Nz9PfLj3Kp/exec';
var params = {};
window.location.search.substring(1).split('&').forEach(function(p){
  var i = p.indexOf('=');
  if(i>0) params[decodeURIComponent(p.substring(0,i))] = decodeURIComponent(p.substring(i+1).replace(/\+/g,' '));
});
delete params._origin;

var url = SURL + '?';
var parts = [];
Object.keys(params).forEach(function(k){
  parts.push(encodeURIComponent(k)+'='+encodeURIComponent(params[k]));
});
url += parts.join('&');

function sendBack(data) {
  try { if(window.opener) window.opener.postMessage(data, '*'); } catch(e){}
  setTimeout(function(){ window.close(); }, 500);
}

// Use fetch for all actions - works when user navigated here
fetch(url)
  .then(function(r){ return r.text(); })
  .then(function(t){
    try {
      // Handle JSONP response: test({...}) -> strip wrapper
      var clean = t.replace(/^[^(]+\(/, '').replace(/\)\s*$/, '');
      var data = JSON.parse(clean);
      sendBack(data);
    } catch(e){
      // Try parsing as plain JSON
      try { sendBack(JSON.parse(t)); } catch(e2){ sendBack({ok:true}); }
    }
  })
  .catch(function(){
    // fetch failed - try JSONP
    var cb = '_p' + Date.now();
    window[cb] = function(data){ clearTimeout(ft); sendBack(data); };
    var sc = document.createElement('script');
    sc.onerror = function(){ clearTimeout(ft); sendBack({ok:false}); };
    sc.src = url + '&callback=' + cb;
    document.head.appendChild(sc);
    var ft = setTimeout(function(){ sendBack({ok:false, msg:'timeout'}); }, 15000);
  });
</script>
</body>
</html>
