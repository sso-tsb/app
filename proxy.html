<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>SSO Proxy</title></head>
<body>
<script>
var SURL = "https://script.google.com/macros/s/AKfycbyywLxrXrIHXN1BNRgz602UiWNKmcs8cTE314B_xGUKFGo2E3wMDifwCgK64Wzdat_R/exec";

// Get all params from our URL
var params = {};
var search = window.location.search.substring(1);
search.split('&').forEach(function(p){
  var kv = p.split('=');
  if(kv[0]) params[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1]||'');
});

var openerOrigin = params._origin || '*';
delete params._origin;

// Send result back to opener and close
function sendBack(result) {
  try { 
    if(window.opener) window.opener.postMessage(result, '*');
  } catch(e) {}
  setTimeout(function(){ window.close(); }, 500);
}

// Make JSONP request to GAS - we are on same domain as observador
// but making request to GAS - this works because it's a direct page navigation
var cbName = '_proxy_cb_' + Date.now();
var url = SURL + '?callback=' + cbName;
Object.keys(params).forEach(function(k){
  url += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
});

window[cbName] = function(data) {
  sendBack(data);
};

// Add script tag
var sc = document.createElement('script');
sc.onerror = function(){ sendBack({ok:false, msg:'error'}); };
sc.src = url;
document.head.appendChild(sc);

// Timeout fallback
setTimeout(function(){
  sendBack({ok:true, assumed:true});
}, 10000);
</script>
<p style="font-family:sans-serif;color:#999;text-align:center;margin-top:40px;font-size:13px">Enviando...</p>
</body>
</html>
