<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SSO</title>
<style>
body{margin:0;font-family:-apple-system,sans-serif;background:#f0f2f5}
.wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px}
.msg{font-size:18px;font-weight:700;color:#1a3a8a}
.sub{font-size:13px;color:#999}
</style>
</head>
<body>
<div class="wrap">
  <div style="font-size:48px">📡</div>
  <div class="msg" id="msg">Enviando observación...</div>
  <div class="sub" id="sub">Por favor esperá unos segundos</div>
</div>

<script>
// Get params from URL
var params = {};
window.location.search.substring(1).split('&').forEach(function(p){
  var i = p.indexOf('=');
  if(i>0) params[decodeURIComponent(p.substring(0,i))] = decodeURIComponent(p.substring(i+1).replace(/\+/g,' '));
});
delete params._origin;

var SURL = 'https://script.google.com/macros/s/AKfycbw7mKh6uGdydT9FuamLbw979veQaZJd07cKdA0m2UaDZms5ZdyhOmGLT6Nz9PfLj3Kp/exec';

// Build URL
var parts = [];
Object.keys(params).forEach(function(k){
  parts.push(encodeURIComponent(k)+'='+encodeURIComponent(params[k]));
});
var url = SURL + '?' + parts.join('&');

function notifyAndClose(ok, msg) {
  document.getElementById('msg').textContent = ok ? '✅ Enviada correctamente' : '❌ Error: '+msg;
  document.getElementById('msg').style.color = ok ? '#388e3c' : '#c62828';
  document.getElementById('sub').textContent = 'Cerrando...';
  try { if(window.opener) window.opener.postMessage({ok:ok}, '*'); } catch(e){}
  setTimeout(function(){ 
    try { window.close(); } catch(e){}
    // If can't close, redirect back
    if(window.opener) {
      try { window.location.href = window.opener.location.href; } catch(e){}
    }
  }, 2000);
}

// Listen for postMessage from the GAS iframe response
window.addEventListener('message', function(e){
  try {
    var data = typeof e.data==='string' ? JSON.parse(e.data) : e.data;
    if(data && data.hasOwnProperty('ok')){
      notifyAndClose(data.ok, data.msg||'');
    }
  } catch(ex){}
});

// Method 1: Load GAS URL in hidden iframe (backend returns postMessage HTML)
var ifr = document.createElement('iframe');
ifr.style.display = 'none';
ifr.src = url; // No callback = backend returns HTML with postMessage
document.body.appendChild(ifr);

// Method 2: If iframe postMessage doesn't fire in 8s, 
// navigate THIS window directly to GAS URL
// GAS will save data and return HTML, then we can't go back - but data IS saved
var t1 = setTimeout(function(){
  document.getElementById('sub').textContent = 'Conectando con el servidor...';
  // Navigate this proxy window directly to GAS URL
  window.location.href = url + '&callback=_done';
}, 8000);

// If we navigated and came back somehow
window._done = function(data){
  clearTimeout(t1);
  notifyAndClose(data && data.ok, '');
};

// Fallback: assume sent after 20s
var t2 = setTimeout(function(){
  notifyAndClose(true, '');
}, 20000);
</script>
</body>
</html>
